name: TrialWeapons
version: 1.2.0
main: com.trialweapons.TrialWeapons
api-version: 1.12
author: Grok
description: Backports Maces, Spears, Wind Charges, Breeze, Bogged, Trial Spawners & Vaults to 1.12.2

commands:
  trial:
    description: Main command for TrialWeapons
    usage: /trial <give|mace|spear|windcharge|recipes|reload|help>
    permission: trialweapons.admin
    aliases: [tw, trialweapons]
  mace:
    description: Get a Mace (OP only)
    usage: /mace
    permission: trialweapons.admin
  spear:
    description: Get a Spear (OP only)
    usage: /spear [iron|diamond|netherite]
    permission: trialweapons.admin
  windcharge:
    description: Get Wind Charges (OP only)
    usage: /windcharge [amount]
    permission: trialweapons.admin
    aliases: [windcharges, wcharge]
  recipes:
    description: View all custom recipes
    usage: /recipes
    permission: trialweapons.use
    aliases: [recipe, crafts]

permissions:
  trialweapons.admin:
    description: Allows giving items and reloading the plugin
    default: op
  trialweapons.use:
    description: Allows using the custom weapons and viewing recipes
    default: true
